# Team repos that am_plr is layered on, and my own (custom) MCP servers.
#
# Upstream skills/agents/rules stay in their repos and load as project scope. Our skills come
# from the am-plr plugin (namespaced am-plr:<skill>), so the two never collide.

# Team MCP servers (qase, cats-mcp-server, teamcity, ...) are not prepared by am_plr. To use them,
# add them to the top-level "mcpServers" of ~/.claude.json as these docs describe. setup.sh prints
# this list. (Must stay above the first [table] so TOML keeps it top-level.)
mcp_docs = [
  "~/projects/perfect-project/cats2/docs/mcp-setup.md",
  "~/projects/vso-engine-autotests/docs/README_MCP.md",
]

[upstream.perfect-project]
path = "~/projects/perfect-project"

[upstream.vso-engine-autotests]
path = "~/projects/vso-engine-autotests"

# ---------------------------------------------------------------------------------------
# My own MCP servers (none yet): each [mcp.<name>] block becomes one entry in
# artifacts/generated/mcp.json. Code for servers I write lives in mcp/<name>/. Example:
#
#   [mcp.my-server]
#   command = "uv"
#   args = ["run", "--script", "${AM_PLR}/mcp/my-server/server.py"]
#   env = { MY_TOKEN = "${MY_TOKEN}" }
#
#   ${AM_PLR}, ${HOME} are filled in by setup. Any other ${VAR} (tokens) stays as-is and Claude Code
#   expands it at runtime from the env (shell/init.zsh loads am_plr/.env).
#   install = "..."  hint printed while `command` does not exist yet
