# Team repos that am_plr is layered on, and the MCP servers setup generates .mcp.json from.
#
# Upstream skills/agents/rules stay in their repos and load as project scope. Our skills come
# from the am plugin (namespaced am:<skill>), so the two never collide.
#
# A relative path is resolved against this repo (so "../perfect-project" is a sibling of am_plr),
# which makes one file work on both machines: ~/projects/<name> and D:\projects\<name>.
# An absolute path or one starting with ~ is used as-is.

[upstream.perfect-project]
path = "../perfect-project"

[upstream.vso-engine-autotests]
path = "../vso-engine-autotests"

# ---------------------------------------------------------------------------------------
# MCP servers -> am_plr/.mcp.json, generated by setup and git-ignored (it holds real tokens).
# Code for servers I write myself lives in mcp/<name>/.
#
# Placeholders filled in for the local OS:
#   ${AM_PLR}              this repo
#   ${HOME}                your home dir
#   ${VENV_PYTHON}         .venv/bin/python  |  .venv\Scripts\python.exe
#   ${upstream.<name>}     the [upstream.<name>] path above
#
# Any other ${VAR} is a credential: setup fills it in from mcp/.env and OMITS the key when it is
# unset, so the server keeps falling back to its own repo .env. Write it as ${VAR?} when that
# fallback is the normal case (optional override) - setup then reports it instead of warning.
#   install = "..."        hint printed while `command` does not exist yet

[mcp.qase]
command = "${VENV_PYTHON}"
args = ["${upstream.vso-engine-autotests}/ai/mcp_servers/qase/qase-mcp-server.py"]
env = { PYTHONPATH = "${upstream.vso-engine-autotests}", QASE_API_TOKEN = "${QASE_API_TOKEN?}" }

[mcp.asana]
type = "sse"
url = "https://mcp.asana.com/sse"

# Slack's official hosted MCP. OAuth as yourself (authorise in /mcp), so messages post under your name.
# Slack's server has no dynamic client registration: the clientId is the one Slack publishes for Claude Code
# (docs.slack.dev/ai/slack-mcp-server/connect-to-claude). The workspace admin must allow the integration.
[mcp.slack]
type = "http"
url = "https://mcp.slack.com/mcp"
oauth = { clientId = "1601185624273.8899143856786", callbackPort = 3118 }

[mcp.teamcity]
command = "${VENV_PYTHON}"
args = ["${upstream.perfect-project}/cats2/ai/mcp_servers/teamcity/teamcity-mcp-server.py"]
env = { TEAMCITY_TOKEN = "${TEAMCITY_TOKEN}" }

[mcp.victoriametrics]
command = "${VENV_PYTHON}"
args = ["${upstream.perfect-project}/cats2/ai/mcp_servers/victoriametrics/victoriametrics-mcp-server.py"]
env = { VICTORIAMETRICS_URL = "${VICTORIAMETRICS_URL?}" }

[mcp.cats-mcp-server]
command = "${VENV_PYTHON}"
args = ["${upstream.perfect-project}/cats2/ai/mcp_servers/cats/cats-mcp-server.py"]

# VSO editor over CATS (editor_* methods), perfect-project PR #20040. Starts only while perfect-project is on a
# branch that has libs/vso/scripts/editor_agent; on others /mcp shows it as failed. The workspace is the checkout
# editor_agent lives in. Group "danger" (delete node/asset) is left out on purpose - append it when needed.
[mcp.vso-editor]
command = "${VENV_PYTHON}"
args = ["-m", "editor_agent.mcp.server", "--groups", "core,edit,prefab,assets"]
env = { PYTHONPATH = "${upstream.perfect-project}/libs/vso/scripts", PYTHONUTF8 = "1" }
