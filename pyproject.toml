[project]
name = "am-plr"
version = "0.1.0"
description = "Shared venv for the MCP servers in .mcp.json; their code stays in the team repos."
# The team repos (cats2, vso-engine-autotests) and their pins target 3.10 only.
requires-python = "==3.10.*"
dependencies = [
	# all servers
	"mcp==1.26.0",
	"pydantic==2.12.5",
	"httpx>=0.28.1",
	"python-dotenv==1.0.1",

	# qase (vso-engine-autotests/ai/mcp_servers/qase)
	"qaseio==4.0.2",
	"loguru==0.7.2",

	# cats-mcp-server: imports the cats2 framework (perfect-project/cats2 + libs/vso/scripts/cats2) at startup.
	# Pins match perfect-project/cats2/pyproject.toml.
	"requests>=2.32",
	"pillow>=9.5.0",
	"numpy==1.26.4",
	"opencv-python==4.9.0.80",
	"PySide6==6.8.2.1",
	"pyautogui==0.9.54",
	"pyperclip==1.11.0",
	"rubicon-objc==0.5.6 ; sys_platform == 'darwin'",
	"pyobjc-framework-Cocoa>=10 ; sys_platform == 'darwin'",
	"dacite==1.9.2",
	"dependency-injector==4.45.0",
	# dependency-injector loads cats2/config.yml through it only at runtime
	"pyyaml==6.0.1",
	"websocket-client==1.6.1",
	"biplist==2.0.0",
	"qtutils==4.0.0",
	"gitpython==3.1.59",
	"pytest==8.3.5",
	"reportportal-client==5.6.7",
	"ci-tc==0.3.44",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

# ci-tc is published only here.
[[tool.uv.index]]
name = "playrix-pypi"
url = "https://nexus.local.playrix.com/repository/playrix-pypi-group/simple"
